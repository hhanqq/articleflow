syntax = "proto3";

package events.v1;

option go_package = "github.com/hanq/articleflow/contracts/gen/go/events/v1;eventsv1pb";

import "google/protobuf/timestamp.proto";

message ArticleDiscoveredEvent {
  string source_name = 1;
  string external_id = 2;
  string url = 3;
  string title = 4;
  string summary = 5;
  string author = 6;
  repeated string tags = 7;
  string language = 8;
  google.protobuf.Timestamp published_at = 9;
  google.protobuf.Timestamp discovered_at = 10;
  string content = 11;
}

message ArticleCreatedEvent {
  string article_id = 1;
  string source_name = 2;
  string external_id = 3;
  string url = 4;
  string title = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp published_at = 7;
}

message ParserJobFailedEvent {
  string job_id = 1;
  string source_name = 2;
  string query = 3;
  string error = 4;
  google.protobuf.Timestamp failed_at = 5;
}

message FeedItemScoredEvent {
  string article_id = 1;
  string source_name = 2;
  string url = 3;
  string title = 4;
  string summary = 5;
  repeated string tags = 6;
  double score = 7;
  google.protobuf.Timestamp published_at = 8;
  google.protobuf.Timestamp scored_at = 9;
}
