syntax = "proto3";

package feed.v1;

option go_package = "github.com/hanq/articleflow/contracts/gen/go/feed/v1;feedv1pb";

import "google/protobuf/timestamp.proto";

message FeedItem {
  string article_id = 1;
  string title = 2;
  string summary = 3;
  string source_name = 4;
  string url = 5;
  repeated string tags = 6;
  double score = 7;
  google.protobuf.Timestamp published_at = 8;
}

service FeedService {
  rpc GetFeed(GetFeedRequest) returns (GetFeedResponse);
}

message GetFeedRequest {
  string user_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message GetFeedResponse {
  repeated FeedItem items = 1;
  string next_cursor = 2;
}

