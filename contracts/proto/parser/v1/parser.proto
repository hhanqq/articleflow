syntax = "proto3";

package parser.v1;

option go_package = "github.com/hanq/articleflow/contracts/gen/go/parser/v1;parserv1pb";

import "google/protobuf/timestamp.proto";

message SearchQuery {
  string text = 1;
  repeated string sources = 2;
  int32 limit = 3;
  string language = 4;
  google.protobuf.Timestamp from_date = 5;
  google.protobuf.Timestamp to_date = 6;
  repeated string tags = 7;
  int32 offset = 8;
}

message ArticleCandidate {
  string source_name = 1;
  string external_id = 2;
  string url = 3;
  string title = 4;
  string summary = 5;
  string content = 6;
  string author = 7;
  repeated string tags = 8;
  string language = 9;
  google.protobuf.Timestamp published_at = 10;
}

message ParserJob {
  string id = 1;
  SearchQuery query = 2;
  string status = 3;
  string error = 4;
  int32 candidates_count = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  repeated ArticleCandidate candidates = 8;
}

service ParserService {
  rpc SearchArticles(SearchArticlesRequest) returns (SearchArticlesResponse);
}

message SearchArticlesRequest {
  SearchQuery query = 1;
}

message SearchArticlesResponse {
  repeated ArticleCandidate candidates = 1;
}
